ll="#111">Початок</text><polygon points="200.9,130.0 342.1,130.0 323.7,176.0 182.5,176.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="262.3" y="157.5" text-anchor="middle" fill="#111">Ввести аргумент t</text><rect x="197.3" y="220.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="262.3" y="247.5" text-anchor="middle" fill="#111">член ряду = t</text><rect x="197.3" y="310.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="262.3" y="337.5" text-anchor="middle" fill="#111">сума = t</text><rect x="197.3" y="400.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="262.3" y="427.5" text-anchor="middle" fill="#111">n = 0</text><polygon points="262.3,490.0 337.3,528.0 262.3,566.0 187.3,528.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="262.3" y="532.5" text-anchor="middle" fill="#111">|член ряду| ≥ ε</text><rect x="82.0" y="610.0" width="360.6" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="262.3" y="637.5" text-anchor="middle" fill="#111">член ряду = член ряду · t² · (2n + 1)² / ((2n + 2)(2n + 3))</text><rect x="175.7" y="700.0" width="173.2" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="262.3" y="727.5" text-anchor="middle" fill="#111">сума = сума + член ряду</text><rect x="197.3" y="790.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="262.3" y="817.5" text-anchor="middle" fill="#111">Збільшити n на 1</text><rect x="197.3" y="924.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="262.3" y="951.5" text-anchor="middle" fill="#111">Повернути суму</text><rect x="197.3" y="1014.0" width="130.0" height="42.0" rx="21.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="262.3" y="1039.5" text-anchor="middle" fill="#111">Кінець</text></svg>