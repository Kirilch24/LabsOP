<svg xmlns="http://www.w3.org/2000/svg" width="733" height="1818" viewBox="0 0 733 1818" font-family="'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="14"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><path d="M417.9 86.0 L417.9 130.0" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M417.9 176.0 L417.9 220.0" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M417.9 266.0 L417.9 310.0" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M417.9 437.9 L417.9 481.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><text x="427.9" y="459.9" text-anchor="start" font-size="12" fill="#444">Так</text><path d="M417.9 527.9 L417.9 571.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M417.9 617.9 L417.9 661.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M417.9 707.9 L417.9 729.9 L611.3 729.9 L611.3 288.0 L417.9 288.0" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M290.0 374.0 L224.6 374.0 L224.6 751.9 L417.9 751.9" fill="none" stroke="#222" stroke-width="1.5"/><text x="257.3" y="365.0" text-anchor="middle" font-size="12" fill="#444">Ні</text><path d="M417.9 751.9 L417.9 795.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M293.9 857.9 L217.0 857.9 L217.0 967.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><text x="259.9" y="848.9" text-anchor="middle" font-size="12" fill="#444">Так</text><path d="M217.0 1013.9 L217.0 1057.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M217.0 1103.9 L217.0 1147.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M217.0 1193.9 L217.0 1237.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M217.0 1283.9 L217.0 1327.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M217.0 1373.9 L217.0 1417.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M217.0 1463.9 L217.0 1507.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M217.0 1553.9 L217.0 1597.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M217.0 1643.9 L217.0 1687.9 L417.9 1687.9" fill="none" stroke="#222" stroke-width="1.5"/><path d="M541.9 857.9 L567.6 857.9 L567.6 967.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><text x="554.8" y="848.9" text-anchor="middle" font-size="12" fill="#444">Ні</text><path d="M567.6 1013.9 L567.6 1687.9 L417.9 1687.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><path d="M417.9 1687.9 L417.9 1731.9" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/><rect x="352.9" y="44.0" width="130.0" height="42.0" rx="21.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="417.9" y="69.5" text-anchor="middle" fill="#111">Початок</text><polygon points="296.3,130.0 558.0,130.0 539.6,176.0 277.9,176.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="417.9" y="157.5" text-anchor="middle" fill="#111">Вивести назву роботи, автора й умову</text><polygon points="345.0,220.0 509.3,220.0 490.9,266.0 326.6,266.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="417.9" y="247.5" text-anchor="middle" fill="#111">Ввести сторони a, b, c</text><polygon points="417.9,310.0 545.9,374.0 417.9,437.9 290.0,374.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="417.9" text-anchor="middle" fill="#111"><tspan x="417.9" y="368.5">Введено не число, або a ≤</tspan><tspan x="417.9" y="388.5">0, або b ≤ 0, або c ≤ 0?</tspan></text><rect x="262.6" y="481.9" width="310.7" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="417.9" y="509.4" text-anchor="middle" fill="#111">Скинути помилку введення і пропустити рядок</text><polygon points="302.5,571.9 551.8,571.9 533.4,617.9 284.1,617.9" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="417.9" y="599.4" text-anchor="middle" fill="#111">Вивести повідомлення про помилку</text><polygon points="345.0,661.9 509.3,661.9 490.9,707.9 326.6,707.9" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="417.9" y="689.4" text-anchor="middle" fill="#111">Ввести сторони a, b, c</text><polygon points="417.9,795.9 541.9,857.9 417.9,919.9 293.9,857.9" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="417.9" text-anchor="middle" fill="#111"><tspan x="417.9" y="852.4">a + b &gt; c, і a + c</tspan><tspan x="417.9" y="872.4">&gt; b, і b + c &gt; a?</tspan></text><rect x="152.0" y="967.9" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="217.0" y="995.4" text-anchor="middle" fill="#111">p = a + b + c</text><rect x="126.4" y="1057.9" width="181.2" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="217.0" y="1085.4" text-anchor="middle" fill="#111">ma = √(2b² + 2c² - a²) / 2</text><rect x="126.0" y="1147.9" width="182.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="217.0" y="1175.4" text-anchor="middle" fill="#111">mb = √(2a² + 2c² - b²) / 2</text><rect x="126.4" y="1237.9" width="181.2" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="217.0" y="1265.4" text-anchor="middle" fill="#111">mc = √(2a² + 2b² - c²) / 2</text><rect x="108.0" y="1327.9" width="218.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="217.0" y="1355.4" text-anchor="middle" fill="#111">la = √(bc · p · (b + c - a)) / (b + c)</text><rect x="108.4" y="1417.9" width="217.2" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="217.0" y="1445.4" text-anchor="middle" fill="#111">lb = √(ac · p · (a + c - b)) / (a + c)</text><rect x="108.0" y="1507.9" width="218.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="217.0" y="1535.4" text-anchor="middle" fill="#111">lc = √(ab · p · (a + b - c)) / (a + b)</text><polygon points="62.4,1597.9 389.9,1597.9 371.5,1643.9 44.0,1643.9" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="217.0" y="1625.4" text-anchor="middle" fill="#111">Вивести медіани ma, mb, mc і бісектриси la, lb, lc</text><polygon points="464.3,967.9 689.3,967.9 670.9,1013.9 445.9,1013.9" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="567.6" y="995.4" text-anchor="middle" fill="#111">Вивести, що трикутник не існує</text><rect x="352.9" y="1731.9" width="130.0" height="42.0" rx="21.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="417.9" y="1757.4" text-anchor="middle" fill="#111">Кінець</text></svg>