 y="677.5">Чисел для CRS = 2 · NNZ матриці A +</tspan><tspan x="688.2" y="697.5">n + 1 + 2 · NNZ матриці B + m + 1 + n ·</tspan><tspan x="688.2" y="717.5">p</tspan></text><rect x="504.8" y="780.0" width="366.7" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="688.2" y="807.5" text-anchor="middle" fill="#111">Чисел для стандартного алгоритму = n · m + m · p + n · p</text><rect x="574.9" y="870.0" width="226.6" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><line x1="583.9" y1="870.0" x2="583.9" y2="916.0" stroke="#222" stroke-width="1.5"/><line x1="792.5" y1="870.0" x2="792.5" y2="916.0" stroke="#222" stroke-width="1.5"/><text x="688.2" y="897.5" text-anchor="middle" fill="#111">Виміряти час обох алгоритмів</text><polygon points="560.1,960.0 834.7,960.0 816.3,1006.0 541.7,1006.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="688.2" y="987.5" text-anchor="middle" fill="#111">Вивести таблицю часу і пам'яті в байтах</text><rect x="333.1" y="1094.0" width="130.0" height="42.0" rx="21.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="398.1" y="1119.5" text-anchor="middle" fill="#111">Кінець</text></svg>