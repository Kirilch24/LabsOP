="1.5"/><text x="267.7" y="69.5" text-anchor="middle" fill="#111">Початок</text><polygon points="179.6,130.0 374.3,130.0 355.9,176.0 161.2,176.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="157.5" text-anchor="middle" fill="#111">Ввести номер рядка тексту</text><rect x="169.0" y="220.0" width="197.5" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="247.5" text-anchor="middle" fill="#111">Обчислити довжину рядка n</text><rect x="202.7" y="310.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="337.5" text-anchor="middle" fill="#111">B₀ = 0</text><rect x="202.7" y="400.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="427.5" text-anchor="middle" fill="#111">i = 1</text><polygon points="267.7,490.0 342.7,528.0 267.7,566.0 192.7,528.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="532.5" text-anchor="middle" fill="#111">i ≤ n</text><rect x="202.7" y="610.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="637.5" text-anchor="middle" fill="#111">Bᵢ = Bᵢ₋₁ + 1</text><rect x="180.4" y="700.0" width="174.8" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="727.5" text-anchor="middle" fill="#111">Шифру в позиції i немає</text><rect x="202.7" y="790.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="817.5" text-anchor="middle" fill="#111">j = 0</text><polygon points="267.7,880.0 358.0,918.0 267.7,956.0 177.4,918.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="922.5" text-anchor="middle" fill="#111">j &lt; кількість шифрів</text><rect x="146.8" y="1000.0" width="241.8" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="1027.5" text-anchor="middle" fill="#111">L = довжина послідовності шифру j</text><rect x="202.7" y="1090.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="1117.5" text-anchor="middle" fill="#111">s = i - L</text><polygon points="267.7,1180.0 353.0,1218.0 267.7,1256.0 182.5,1218.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="1222.5" text-anchor="middle" fill="#111">s ≥ 0 і Bₛ + 1 &lt; Bᵢ</text><polygon points="267.7,1304.0 415.5,1377.9 267.7,1451.7 120.0,1377.9" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" text-anchor="middle" fill="#111"><tspan x="267.7" y="1372.4">Текст від позиції s збігається з</tspan><tspan x="267.7" y="1392.4">послідовністю шифру j?</tspan></text><rect x="202.7" y="1499.7" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="1527.2" text-anchor="middle" fill="#111">Bᵢ = Bₛ + 1</text><rect x="163.7" y="1589.7" width="208.1" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="1617.2" text-anchor="middle" fill="#111">Запам'ятати шифр j у позиції i</text><rect x="202.7" y="1767.7" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="1795.2" text-anchor="middle" fill="#111">Збільшити j на 1</text><rect x="202.7" y="1901.7" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="1929.2" text-anchor="middle" fill="#111">Збільшити i на 1</text><rect x="202.7" y="2035.7" width="130.0" height="42.0" rx="21.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="267.7" y="2061.2" text-anchor="middle" fill="#111">Кінець</text></svg>